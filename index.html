
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Şerzan Özekinci | Özekinci Dijital</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #080808;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.card {
  width: 100%;
  max-width: 390px;
  padding: 28px 22px;
  background: linear-gradient(145deg, #1b1b1b, #0b0b0b);
  border: 1px solid #b89445;
  border-radius: 22px;
  box-shadow: 0 12px 40px #000;
}

.logo {
  text-align: center;
  color: #d8b66a;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 30px;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 0 0 8px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 32px;
}

.label {
  color: #b9a16e;
  font-size: 11px;
  letter-spacing: 1.5px;
  margin-bottom: 10px;
}

.info-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
}

.name {
  flex: 1;
  min-width: 0;
  font-size: 17px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.iban {
  flex: 1;
  min-width: 0;
  padding: 12px;
  background: #202020;
  border: 1px solid #383838;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.copy-small {
  flex: 0 0 46px;
  width: 46px;
  height: 46px;
  margin: 0;
  padding: 0;
  border: 1px solid #d8b66a;
  border-radius: 10px;
  background: #d8b66a;
  color: #111;
  font-size: 21px;
  cursor: pointer;
}

.copy-small:active {
  transform: scale(0.96);
}

.note {
  text-align: center;
  color: #999;
  font-size: 11px;
  line-height: 1.7;
  margin-top: 12px;
}

.status {
  text-align: center;
  color: #d8b66a;
  font-size: 12px;
  min-height: 18px;
  margin-top: 14px;
}
</style>
</head>

<body>
<main class="card">

  <div class="logo">ÖZEKİNCİ DİJİTAL</div>

  <h1>Şerzan Özekinci</h1>
  <div class="subtitle">Hesap bilgileri</div>

  <div class="label">HESAP SAHİBİ</div>

  <div class="info-row">
    <div class="name">Şerzan Özekinci</div>
    <button class="copy-small"
      aria-label="İsim ve soyismi kopyala"
      onclick="copyText('Şerzan Özekinci', this)"
      title="İsmi kopyala">▢</button>
  </div>

  <div class="label">IBAN NUMARASI</div>

  <div class="info-row">
    <div class="iban" id="iban">
      TR00 0000 0000 0000 0000 0000 00
    </div>
    <button class="copy-small"
      aria-label="IBAN numarasını kopyala"
      onclick="copyText('TR000000000000000000000000', this)"
      title="IBAN'ı kopyala">▢</button>
  </div>

  <div class="note">
    Bilgileri yanlarındaki kopyalama simgelerine dokunarak
    kolayca kopyalayabilirsin
  </div>

  <div class="status" id="status" aria-live="polite"></div>

</main>

<script>
async function copyText(text, button) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();

      const success = document.execCommand("copy");
      area.remove();

      if (!success) throw new Error("Kopyalama başarısız");
    }

    document.getElementById("status").textContent =
      "Başarıyla kopyalandı ✓";

    const old = button.textContent;
    button.textContent = "✓";

    setTimeout(() => {
      button.textContent = old;
    }, 1500);

  } catch (error) {
    document.getElementById("status").textContent =
      "Kopyalanamadı, lütfen tekrar dene";
  }
}
</script>

</body>
</html>
